<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Prefeitura Municipal de Guaraci-SP</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #002B7F 0%, #001F5C 50%, #00875A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border-top: 5px solid #00875A;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .guaraci-logo-login {
      max-width: 220px;
      height: auto;
      margin-bottom: 1rem;
    }
    .login-header h1 {
      font-size: 1.3rem;
      color: #002B7F;
      margin: 0 0 0.25rem 0;
      font-weight: 700;
      white-space: nowrap;
    }
    .login-header p {
      color: #4a5568;
      font-size: 0.95rem;
      margin: 0;
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #2d3748;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: #00875A;
      box-shadow: 0 0 0 3px rgba(0, 135, 90, 0.2);
    }
    .btn-login {
      width: 100%;
      padding: 0.85rem;
      font-size: 1.05rem;
      font-weight: 700;
      background: linear-gradient(135deg, #002B7F 0%, #00875A 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn-login:hover {
      box-shadow: 0 5px 15px rgba(0, 43, 127, 0.4);
    }
    .btn-register {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      background: transparent;
      color: #00875A;
      border: 2px solid #00875A;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: background 0.2s, color 0.2s;
    }
    .btn-register:hover {
      background: #00875A;
      color: white;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0 0.5rem;
      color: #a0aec0;
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }
    .alert-error {
      background: #fed7d7;
      border: 1px solid #feb2b2;
      color: #c53030;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      display: none;
      font-size: 0.9rem;
    }
    .alert-success {
      background: #c6f6d5;
      border: 1px solid #9ae6b4;
      color: #276749;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      display: none;
      font-size: 0.9rem;
    }
    /* Modal de Cadastro */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: white;
      border-radius: 14px;
      padding: 2rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border-top: 5px solid #002B7F;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-box h2 {
      color: #002B7F;
      font-size: 1.2rem;
      margin: 0 0 0.25rem 0;
    }
    .modal-box p.subtitle {
      color: #718096;
      font-size: 0.85rem;
      margin: 0 0 1.5rem 0;
    }
    .modal-close-btn {
      float: right;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #a0aec0;
      line-height: 1;
      margin-top: -4px;
    }
    .modal-close-btn:hover { color: #e53e3e; }
    .contact-info-box {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.78rem;
      color: #a0aec0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <img src="logo_guaraci.png" alt="Prefeitura Municipal de Guaraci - SP" class="guaraci-logo-login" />
      <h1>Prefeitura Municipal de Guaraci - SP</h1>
      <p>Sistema de Chamados &amp; Controle de Toners</p>
    </div>

    <div id="errorAlert" class="alert-error"></div>
    <div id="successAlert" class="alert-success"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuário ou E-mail</label>
        <input type="text" id="username" class="form-control" placeholder="Digite seu usuário ou e-mail" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" id="submitBtn" class="btn-login">Entrar no Sistema</button>
    </form>

    <div class="divider">ou</div>
    <button type="button" class="btn-register" onclick="openRegisterModal()">✍️ Solicitar Cadastro</button>

    <div class="contact-info-box">
      Dúvidas? Entre em contato com o Departamento de TI — 17 3285-9997
    </div>
  </div>

  <!-- Modal de Solicitação de Cadastro -->
  <div id="registerModal" class="modal-overlay">
    <div class="modal-box">
      <button class="modal-close-btn" onclick="closeRegisterModal()" title="Fechar">&times;</button>
      <h2>✍️ Solicitar Cadastro</h2>
      <p class="subtitle">Preencha os dados abaixo. Seu cadastro será analisado e aprovado pelo administrador.</p>

      <div id="registerError" class="alert-error"></div>
      <div id="registerSuccess" class="alert-success"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="regLogin">Login / Nome de Usuário *</label>
          <input type="text" id="regLogin" class="form-control" placeholder="ex: JoaoSilva" required />
        </div>

        <div class="form-group">
          <label for="regNome">Nome Completo *</label>
          <input type="text" id="regNome" class="form-control" placeholder="ex: João da Silva" required />
        </div>

        <div class="form-group">
          <label for="regEmail">E-mail *</label>
          <input type="email" id="regEmail" class="form-control" placeholder="joao@guaraci.sp.gov.br" required />
        </div>

        <div class="form-group">
          <label for="regDepartamento">Departamento / Setor *</label>
          <input type="text" id="regDepartamento" class="form-control" placeholder="ex: FINANCEIRO, RH, ADMINISTRAÇÃO" required />
        </div>

        <div class="form-group">
          <label for="regPassword">Senha (mín. 4 caracteres) *</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required minlength="4" />
        </div>

        <div class="form-group">
          <label for="regPasswordConfirm">Confirmar Senha *</label>
          <input type="password" id="regPasswordConfirm" class="form-control" placeholder="••••••••" required minlength="4" />
        </div>

        <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
          <button type="button" onclick="closeRegisterModal()" style="flex:1; padding: 0.75rem; border: 1px solid #cbd5e0; border-radius: 8px; background: white; cursor: pointer; font-weight: 600; color: #4a5568;">Cancelar</button>
          <button type="submit" id="regSubmitBtn" style="flex:2; padding: 0.75rem; font-size: 1rem; font-weight: 700; background: linear-gradient(135deg, #002B7F 0%, #00875A 100%); color: white; border: none; border-radius: 8px; cursor: pointer;">Enviar Solicitação</button>
        </div>
      </form>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Se já estiver logado, redirecionar para a Central de Chamados
    if (Auth.getUser()) {
      window.location.href = 'chamados.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');
      const submitBtn = document.getElementById('submitBtn');

      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Autenticando...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erro ao realizar login');
        }

        Auth.setUser(data.user, data.token);
        window.location.href = 'chamados.html';
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar no Sistema';
      }
    });

    function openRegisterModal() {
      document.getElementById('registerForm').reset();
      document.getElementById('registerError').style.display = 'none';
      document.getElementById('registerSuccess').style.display = 'none';
      document.getElementById('regSubmitBtn').disabled = false;
      document.getElementById('regSubmitBtn').textContent = 'Enviar Solicitação';
      document.getElementById('registerModal').classList.add('active');
    }

    function closeRegisterModal() {
      document.getElementById('registerModal').classList.remove('active');
    }

    // Fechar modal ao clicar no overlay
    document.getElementById('registerModal').addEventListener('click', function(e) {
      if (e.target === this) closeRegisterModal();
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('registerError');
      const successEl = document.getElementById('registerSuccess');
      const submitBtn = document.getElementById('regSubmitBtn');

      const login = document.getElementById('regLogin').value.trim();
      const nome = document.getElementById('regNome').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const departamento = document.getElementById('regDepartamento').value.trim();
      const password = document.getElementById('regPassword').value;
      const passwordConfirm = document.getElementById('regPasswordConfirm').value;

      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      if (password !== passwordConfirm) {
        errorEl.textContent = 'As senhas não coincidem. Verifique e tente novamente.';
        errorEl.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, nome, email, departamento, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erro ao enviar solicitação');
        }

        successEl.textContent = data.message;
        successEl.style.display = 'block';
        document.getElementById('registerForm').reset();
        submitBtn.textContent = '✅ Solicitação Enviada!';

        setTimeout(() => closeRegisterModal(), 3500);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar Solicitação';
      }
    });
  </script>
</body>
</html>
